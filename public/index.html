<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b6e8a">
  <title>作業管理システム ログイン</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
  <main class="login-wrap">
    <form class="card login-card" id="loginForm" novalidate>
      <div class="brand-mark">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#0b6e8a"/><path d="M20 8c5 7 9 11.5 9 16a9 9 0 0 1-18 0c0-4.5 4-9 9-16z" fill="#fff"/></svg>
        <div>
          <div style="font-weight:800">一戸浄化槽</div>
          <div class="muted small">作業管理システム</div>
        </div>
      </div>
      <div id="demoBox" class="notice info small hidden">
        <b>デモ版</b>：入力したデータは一定時間で初期化されます。<br>
        管理者 <code>admin</code> / <code>Ichinohe-Admin-2026</code><br>
        作業員 <code>sato</code> / <code>Ichinohe-Sato-2026</code><br>
        <span class="muted">現場到着を試すには、管理画面の「顧客・浄化槽」で顧客を開き「現在地を浄化槽の位置にする」を押してください。QRは管理画面の「QR印刷」を画面に表示し、スマホで読み取れます。</span>
      </div>
      <div id="err" class="notice danger hidden" role="alert"></div>
      <label class="field"><span>ログインID</span><input name="login_id" id="login_id" autocomplete="username" autocapitalize="off" required></label>
      <label class="field"><span>パスワード</span><input name="password" id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary btn-lg" type="submit">ログイン</button>
      <p class="muted small" style="margin-top:12px">現場ではスマートフォンの位置情報をオンにしてご利用ください。</p>
    </form>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
